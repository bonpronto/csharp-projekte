<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casino</title>
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117;
    --konsole: #0c0c0c;
    --text: #cccccc;
    --titel: #1f1f1f;
    --line: #333;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100dvh;
  }
  .fenster {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: 900px;
    margin: 12px auto 0;
    padding: 0 12px;
  }
  .titel {
    background: var(--titel);
    border: 1px solid var(--line);
    border-bottom: 0;
    border-radius: 8px 8px 0 0;
    padding: 8px 12px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13px;
    color: #aaa;
    flex: 0 0 auto;
  }
  .titel b { color: var(--text); font-weight: 500; }
  .screen {
    flex: 1 1 auto;
    min-height: 0;
    overflow: auto;
    background: var(--konsole);
    border: 1px solid var(--line);
    border-radius: 0 0 8px 8px;
    padding: 10px 12px;
    cursor: text;
  }
  #term {
    margin: 0;
    white-space: pre;
    font-family: 'JetBrains Mono', Consolas, 'Courier New', monospace;
    font-size: clamp(7px, 2.3vw, 15px);
    line-height: 1.25;
    color: var(--text);
  }
  #term input {
    background: transparent;
    border: 0;
    outline: 0;
    padding: 0;
    margin: 0;
    font: inherit;
    color: inherit;
    caret-color: var(--text);
    width: 1ch;
    min-width: 1ch;
  }
  .leiste {
    flex: 0 0 auto;
    max-width: 900px;
    width: 100%;
    margin: 0 auto;
    padding: 10px 12px 14px;
  }
  #enter {
    width: 100%;
    padding: 14px;
    background: transparent;
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 10px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 16px;
    cursor: pointer;
  }
  #enter:active { background: var(--titel); }
</style>
</head>
<body>
<div class="fenster">
  <div class="titel">C:\ <b>Casino</b></div>
  <div class="screen" id="screen">
    <pre id="term"><span id="ausgabe"></span><input id="eingabe" type="text" autocomplete="off" spellcheck="false" autofocus></pre>
  </div>
</div>

<div class="leiste">
  <button id="enter" onclick="senden()">Enter ↵</button>
</div>

<script>
  const ausgabe = document.getElementById('ausgabe');
  const eingabe = document.getElementById('eingabe');
  const screen = document.getElementById('screen');

  // Passt die Breite des Eingabefelds automatisch an den getippten Text an
  eingabe.addEventListener('input', () => {
    eingabe.style.width = Math.max(1, eingabe.value.length + 1) + 'ch';
  });

  // Klick irgendwo ins schwarze Fenster setzt den Cursor ins Eingabefeld
  screen.addEventListener('click', () => eingabe.focus());

  // Enter-Taste löst Senden aus
  eingabe.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      senden();
    }
  });

  // 1. Holt laufend neue Ausgaben vom C#-Programm über Python
  async function holeOutput() {
    const res = await fetch('/output');
    const daten = await res.json();
    if (daten.text) {
      ausgabe.textContent += daten.text;
      screen.scrollTop = screen.scrollHeight;
    }
  }

  // 2. Schickt deine Eingabe an Python -> weiter an C#
  async function senden() {
    const text = eingabe.value;
    eingabe.value = '';
    eingabe.style.width = '1ch';
    ausgabe.textContent += text + '\n';
    screen.scrollTop = screen.scrollHeight;

    await fetch('/input', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ eingabe: text })
    });
  }

  // Alle 150 Millisekunden nach neuem Text aus C# fragen
  setInterval(holeOutput, 150);
</script>
</body>
</html>
