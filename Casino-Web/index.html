<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117;
    --konsole: #0c0c0c;
    --text: #cccccc;
    --titel: #1f1f1f;
    --line: #333;
    --accent: #f5b700;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100dvh;
  }
  .fenster {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: 900px;
    margin: 12px auto 0;
    padding: 0 12px;
  }
  .titel {
    background: var(--titel);
    border: 1px solid var(--line);
    border-bottom: 0;
    border-radius: 8px 8px 0 0;
    padding: 8px 12px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13px;
    color: #aaa;
    flex: 0 0 auto;
  }
  .titel b { color: var(--text); font-weight: 500; }
  .screen {
    flex: 1 1 auto;
    min-height: 0;
    overflow: auto;
    background: var(--konsole);
    border: 1px solid var(--line);
    border-radius: 0 0 8px 8px;
    padding: 10px 12px;
    cursor: text;
  }
  #term {
    margin: 0;
    white-space: pre;
    font-family: 'JetBrains Mono', Consolas, 'Courier New', monospace;
    font-size: clamp(7px, 2.3vw, 15px);
    line-height: 1.25;
    color: var(--text);
  }
  #term input {
    background: transparent;
    border: 0;
    outline: 0;
    padding: 0;
    margin: 0;
    font: inherit;
    color: inherit;
    caret-color: var(--text);
    width: 1ch;
    min-width: 1ch;
  }
  .leiste {
    flex: 0 0 auto;
    max-width: 900px;
    width: 100%;
    margin: 0 auto;
    padding: 10px 12px 14px;
  }
  #enter {
    width: 100%;
    padding: 14px;
    background: transparent;
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 10px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 16px;
    cursor: pointer;
  }
  #enter:active { background: var(--titel); }
  #enter:disabled { opacity: .35; cursor: default; }
</style>
</head>
<body>
<div class="fenster">
  <div class="titel">C:\ <b>Casino</b></div>
  <div class="screen" id="screen"><pre id="term"></pre></div>
</div>

<div class="leiste">
  <button id="enter" disabled>Enter ↵</button>
</div>

<script>
  // ---------- Einstellungen ----------
  const START_GUTHABEN = 500;
  const GEWINN_FAKTOR = 2;                 // Auszahlung = Einsatz * Faktor
  const X_GEWINNT = false;                 // true: drei 'x' zählen auch als Gewinn
  const SYMBOLE = ['x', '*', '~', '#'];    // wie rng.Next(0, 4) im C#-Programm
  const ZEILEN_PAUSE = 350;                // Pause zwischen den Ausgabezeilen (ms)

  const JACKPOT = [
    "   ██████  █████   ██████  ██   ██ ██████   █████  ████████ ",
    "       ██ ██   ██ ██       ██  ██  ██   ██ ██   ██    ██    ",
    "       ██ ███████ ██       █████   ██████  ██   ██    ██    ",
    "  ██   ██ ██   ██ ██       ██  ██  ██      ██   ██    ██    ",
    "   █████  ██   ██  ██████  ██   ██ ██       █████     ██    "
  ].join('\n');

  const LOSER = [
    " ██       ██████  ███████ ███████ ██████  ",
    " ██      ██    ██ ██      ██      ██   ██ ",
    " ██      ██    ██ ███████ █████   ██████  ",
    " ██      ██    ██      ██ ██      ██   ██ ",
    " ███████  ██████  ███████ ███████ ██   ██ "
  ].join('\n');

  // ---------- Elemente ----------
  const term = document.getElementById('term');
  const screen = document.getElementById('screen');
  const btnEnter = document.getElementById('enter');
  let wartend = null;   // Funktion, die der Enter-Button auslöst

  // ---------- "Konsole" ----------
  function scrollEnde() {
    screen.scrollTop = screen.scrollHeight;
  }

  function print(text) {
    term.appendChild(document.createTextNode(text + '\n'));
    scrollEnde();
  }

  function sleep(ms) {
    return new Promise(function (r) { setTimeout(r, ms); });
  }

  // wie Console.ReadLine(); suffix z. B. ' €' bleibt hinter der Eingabe stehen
  function readLine(suffix) {
    return new Promise(function (resolve) {
      const zeile = document.createElement('span');
      const input = document.createElement('input');
      input.type = 'text';
      input.setAttribute('inputmode', 'decimal');
      input.setAttribute('autocomplete', 'off');
      input.setAttribute('autocapitalize', 'off');
      input.setAttribute('spellcheck', 'false');
      zeile.appendChild(input);
      if (suffix) zeile.appendChild(document.createTextNode(suffix));
      term.appendChild(zeile);

      function anpassen() {
        input.style.width = Math.max(1, input.value.length + 1) + 'ch';
      }
      anpassen();
      input.addEventListener('input', anpassen);

      function fertig() {
        const wert = input.value;
        zeile.remove();
        wartend = null;
        btnEnter.disabled = true;
        print(wert + (suffix || ''));
        resolve(wert);
      }
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          fertig();
        }
      });

      wartend = fertig;
      btnEnter.disabled = false;
      input.focus();
      scrollEnde();
    });
  }

  // wie Console.ReadKey(): wartet auf eine Taste oder ein Antippen
  function readKey() {
    return new Promise(function (resolve) {
      let erledigt = false;
      function fertig() {
        if (erledigt) return;
        erledigt = true;
        window.removeEventListener('keydown', onKey);
        screen.removeEventListener('pointerdown', fertig);
        wartend = null;
        btnEnter.disabled = true;
        resolve();
      }
      function onKey(e) {
        if (['Shift', 'Control', 'Alt', 'Meta', 'CapsLock'].indexOf(e.key) !== -1) return;
        e.preventDefault();
        fertig();
      }
      // kurz warten, damit das Enter der vorigen Eingabe nicht sofort durchrutscht
      setTimeout(function () {
        if (erledigt) return;
        window.addEventListener('keydown', onKey);
        screen.addEventListener('pointerdown', fertig);
      }, 80);
      wartend = fertig;
      btnEnter.disabled = false;
    });
  }

  btnEnter.addEventListener('click', function () {
    if (wartend) wartend();
  });

  // Antippen der Konsole setzt den Cursor wieder ins Eingabefeld
  screen.addEventListener('click', function () {
    const input = term.querySelector('input');
    if (input) input.focus();
  });

  // ---------- Hilfsfunktionen ----------
  function zufallsSymbol() {
    return SYMBOLE[Math.floor(Math.random() * SYMBOLE.length)];
  }

  function euro(zahl) {
    return zahl.toLocaleString('de-DE', { maximumFractionDigits: 2 });
  }

  function leer(n) {
    return ' '.repeat(n);
  }

  // ---------- Spiel ----------
  async function spiel() {
    while (true) {
      let guthaben = START_GUTHABEN;
      print('Willkommen im Casino!');

      do {
        print('\nKonto: ' + euro(guthaben));

        // Versuche abfragen (1 bis 3)
        let versuche = 0;
        while (true) {
          print('Wie viele Versuche wollen sie nehmen');
          const text = (await readLine()).trim();
          const zahl = Number(text);
          if (text !== '' && Number.isInteger(zahl) && zahl >= 1 && zahl <= 3) {
            versuche = zahl;
            break;
          }
          print('Keine gültige Zahl (bitte 1, 2 oder 3 eingeben).\n');
        }

        // Einsatz abfragen
        print('Ihr Einsatz bitte ein geben:');
        const einsatzText = (await readLine(' €')).trim().replace(',', '.');
        const einsatz = Number(einsatzText);

        if (einsatzText === '' || !isFinite(einsatz) || einsatz <= 0) {
          print('Ihr Einsatz (' + einsatzText + ' Euro) ist nicht gültig');
          print('Bitte drücken sie eine Taste ...');
          await readKey();
          continue;
        }
        if (einsatz > guthaben) {
          print('Ihr Einsatz (' + euro(einsatz) + ' Euro) ist höher als Ihr Konto');
          print('Bitte drücken sie eine Taste ...');
          await readKey();
          continue;
        }

        guthaben = guthaben - einsatz;          // Einsatz wird sofort abgezogen
        print('Konto: ' + euro(guthaben));
        print('\n');

        // Tabelle: Kopfzeile
        print(leer(8) + 'Versuch 1' + leer(7) + 'Versuch 2' + leer(7) + 'Versuch 3');

        // Würfeln: ergebnis[versuch][zeile]
        const ergebnis = [];
        for (let v = 0; v < versuche; v++) {
          ergebnis.push([zufallsSymbol(), zufallsSymbol(), zufallsSymbol()]);
        }

        // Tabelle zeilenweise ausgeben
        for (let z = 0; z < 3; z++) {
          let zeile = leer(12) + ergebnis[0][z];
          for (let v = 1; v < versuche; v++) {
            zeile += leer(15) + ergebnis[v][z];
          }
          print(zeile);
          await sleep(ZEILEN_PAUSE);
        }

        // Auswertung: mindestens ein Versuch mit 3 gleichen Symbolen?
        let gewonnen = false;
        for (let v = 0; v < versuche; v++) {
          const r = ergebnis[v];
          if (r[0] === r[1] && r[1] === r[2] && (r[0] !== 'x' || X_GEWINNT)) {
            gewonnen = true;
          }
        }

        if (gewonnen) {
          guthaben = guthaben + einsatz * GEWINN_FAKTOR;
          print('\n' + JACKPOT);
        } else {
          print('\n' + LOSER);
        }
        print('Ihr neuer kontostand ist ' + euro(guthaben) + ' Euro.');
        print('Drücken sie eine beliebige Taste ...');
        await readKey();

      } while (guthaben > 0);

      print('Leider reicht das Guthaben nicht mehr');
      print('Bitte drücken sie eine Taste ...');
      await readKey();
      print('-------------------------------------\n');
    }
  }

  spiel();
</script>
</body>
</html>
